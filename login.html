.hide{display:none!important}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
body{justify-content:center;padding:24px}.box{max-width:380px;width:100%;margin:auto;display:flex;flex-direction:column;gap:12px}.box img{width:116px;height:116px;border-radius:30px;margin:0 auto;box-shadow:0 14px 34px #0007}.box h2{text-align:center;font:700 34px Georgia,serif;letter-spacing:2px}.box h2 b{color:var(--ac);font-weight:400}#msg{text-align:center;color:var(--ac);min-height:22px}.tabs{display:flex;background:var(--p);border-radius:20px;padding:5px;box-shadow:var(--sh)}.tabs button{flex:1;background:0;color:var(--m);box-shadow:none}.tabs .on{background:linear-gradient(145deg,var(--me1),var(--me2));color:var(--on)}</style></head><body><svg class="bg" viewBox="0 0 400 800" preserveAspectRatio="none" aria-hidden="true"><path style="fill:var(--w1)" d="M0 0H400V250C300 190 190 330 0 250Z"/><path style="fill:var(--w2);opacity:.55" d="M400 110C300 170 240 390 0 430V800H400Z"/><path style="fill:var(--w3);opacity:.35" d="M0 570C150 520 280 690 400 610V800H0Z"/></svg><div class="box"><img src="icon-192.png" alt=""><h2>B<b>&amp;</b>A</h2>

const cfg={apiKey:"AIzaSyCIYvVSg5KwPnD1lZK7u4oQx1e8l6KXgrc",authDomain:"baml-85266.firebaseapp.com",projectId:"baml-85266",storageBucket:"baml-85266.firebasestorage.app",messagingSenderId:"691113580861",appId:"1:691113580861:web:42f790d56f436ea6eb8d54",measurementId:"G-V2QNK2FNQ1"};
firebase.initializeApp(cfg);
const auth=firebase.auth(),db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp(),$=i=>document.getElementById(i);
const VAPID="BG2TIDHdDVbrUxFBv2UPwucc9wQjvrhoBIAWV9WKL27_Av16_-rsC8dfNXgm3uVufsIp3sp-8Hb9GDwkYfleQQ0";
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
const em=u=>u.trim().toLowerCase().replace(/\s+/g,'_')+'@baml.app';
if('serviceWorker' in navigator)navigator.serviceWorker.register('firebase-messaging-sw.js');
(function(){const d=document.documentElement,b=document.createElement('button');b.className='i';
 const m=()=>document.querySelector('meta[name=theme-color]').content=d.dataset.theme==='light'?'#efe5d9':'#0a1f1a',u=()=>{b.textContent=d.dataset.theme==='light'?'🌙':'☀️';m()};u();
 b.onclick=()=>{d.dataset.theme=d.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('baml-theme',d.dataset.theme)}catch(e){}u()};
 const h=document.querySelector('header');h?h.appendChild(b):(b.style.cssText='position:fixed;top:12px;left:12px;z-index:5',document.body.appendChild(b))})();
function guard(cb){auth.onAuthStateChanged(async u=>{
 if(!u)return location.replace('login.html');
 const d=(await db.doc('users/'+u.uid).get()).data();
 if(!d||d.status!=='approved'){await auth.signOut();return location.replace('login.html?s='+(d?d.status:'x'))}
 cb(u,d);enablePush(u,false)})}
async function enablePush(u,manual){
 const say=m=>{if(manual)alert(m);return m};
 try{
  if(!VAPID.startsWith('B'))return say('مفتاح VAPID غير مضاف في الكود');
  if(!('Notification' in window)||!firebase.messaging.isSupported())return say('المتصفح لا يدعم الإشعارات. على الآيفون: ثبّت الموقع على الشاشة الرئيسية أولا (iOS 16.4 أو أحدث)');
  if(Notification.permission==='denied')return say('الإشعارات محظورة. فعّلها من إعدادات الموقع أو التطبيق في الهاتف');
  if(Notification.permission!=='granted'&&!manual)return;
  if(await Notification.requestPermission()!=='granted')return say('لم يتم السماح بالإشعارات');
  const reg=await navigator.serviceWorker.ready;
  const t=await firebase.messaging().getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});
  if(!t)return say('تعذر الحصول على توكن الجهاز');
  await db.doc('users/'+u.uid).update({tokens:firebase.firestore.FieldValue.arrayUnion(t)});
  return say('تم تفعيل الإشعارات على هذا الجهاز ✅')
 }catch(e){return say('خطأ: '+(e.code||e.message))}}

let reg=false;const msg=t=>$('msg').textContent=t,s=new URLSearchParams(location.search).get('s');
if(s==='pending')msg('حسابك بانتظار موافقة المسؤول');if(s==='rejected')msg('تم رفض حسابك');
auth.onAuthStateChanged(u=>{if(u&&!window.busy)location.replace('index.html')});
function tab(r){reg=r;$('t1').className=r?'':'on';$('t2').className=r?'on':'';$('ph').classList.toggle('hide',!r);$('go').textContent=r?'إنشاء حساب':'دخول';msg('')}
$('t1').onclick=()=>tab(0);$('t2').onclick=()=>tab(1);
$('go').onclick=async()=>{const u=$('u').value.trim(),p=$('p').value,ph=$('ph').value.trim();
 if(!u||p.length<6||(reg&&!ph))return msg('أكمل البيانات (كلمة السر 6 أحرف على الأقل)');
 window.busy=1;msg('...');
 try{
  if(reg){const c=await auth.createUserWithEmailAndPassword(em(u),p);
   const first=(await db.collection('users').limit(1).get()).empty;
   await db.doc('users/'+c.user.uid).set({username:u,phone:ph,status:first?'approved':'pending',admin:first,createdAt:TS()});
   if(!first){await auth.signOut();window.busy=0;tab(0);return msg('تم إنشاء الحساب، بانتظار موافقة المسؤول')}}
  else{const c=await auth.signInWithEmailAndPassword(em(u),p);
   const d=(await db.doc('users/'+c.user.uid).get()).data();
   if(!d||d.status!=='approved'){await auth.signOut();window.busy=0;return msg(d&&d.status==='rejected'?'تم رفض حسابك':'حسابك بانتظار موافقة المسؤول')}}
  location.replace('index.html')
 }catch(e){window.busy=0;msg(e.code==='auth/email-already-in-use'?'اسم المستخدم مستخدم':'بيانات غير صحيحة')}};
</script></body></html>
