<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#18112b">
<title>B&A | المحادثة</title>
<link rel="icon" href="https://i.ibb.co/XrzQxS3p/file-00000000dbbc821090f43517cfc56949.webp">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f7fa; --header-bg:#ffffff; --chat-bg:#f0eff4;
    --text:#18112b; --text-muted:#6b6378; --accent:#8c5bf5;
    --border:#e2dfeb; --msg-other:#ffffff; --msg-me:#8c5bf5;
    --msg-me-text:#ffffff;
  }
  body.dark{
    --bg:#0f091a; --header-bg:#18112b; --chat-bg:#110b1f;
    --text:#f2e6d8; --text-muted:#a99ebf; --accent:#b48aff;
    --border:#3a2b5c; --msg-other:#211738; --msg-me:#5e3c99;
    --msg-me-text:#f2e6d8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);transition:.3s;}
  
  header{background:var(--header-bg);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;transition:.3s;z-index:10;}
  header img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--border);}
  body.dark header img{border-color:var(--accent)}
  header .title{flex:1;font-family:'Playfair Display',serif;font-size:20px;font-weight:700;}
  .icon-btn{background:transparent;border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--chat-bg);}
  .msg{max-width:85%;padding:10px 14px;border-radius:18px;background:var(--msg-other);font-size:14px;line-height:1.5;word-wrap:break-word;align-self:flex-start;box-shadow:0 2px 5px rgba(0,0,0,0.05);border:1px solid var(--border);position:relative;}
  .msg .who{font-size:11px;color:var(--accent);margin-bottom:5px;font-weight:700;}
  .msg.me{align-self:flex-end;background:var(--msg-me);color:var(--msg-me-text);border-bottom-right-radius:5px;border-color:transparent;}
  .msg:not(.me){border-bottom-left-radius:5px}
  .msg.me .who{color:rgba(255,255,255,0.7)}
  body.dark .msg.me .who{color:#d1bfff}
  
  /* وسائط */
  .msg img, .msg video {max-width:100%;border-radius:10px;margin-top:5px;}
  .msg audio {width:100%;margin-top:5px;}
  .msg .file-link {display:flex;align-items:center;gap:8px;padding:8px;background:rgba(0,0,0,0.1);border-radius:8px;margin-top:5px;color:inherit;text-decoration:none;}
  .msg .file-link svg{width:24px;height:24px;flex-shrink:0;}

  footer{display:flex;gap:8px;padding:10px;background:var(--header-bg);border-top:1px solid var(--border);align-items:flex-end;}
  footer textarea{flex:1;padding:12px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;resize:none;max-height:100px;font-family:inherit;}
  footer textarea:focus{border-color:var(--accent);}
  .action-btn{background:transparent;border:none;color:var(--text);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;}
  .action-btn:hover{background:var(--border)}
  .send-btn{background:var(--accent);color:#fff;border:none;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;box-shadow:0 4px 10px rgba(140,91,245,0.3);}
  .send-btn:active{transform:scale(0.95)}
  body.dark .send-btn{color:#18112b}

  /* ريكورد */
  #record-btn.recording{color:#ff4d4d;animation:pulse 1s infinite;}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
</style>
</head>
<body>
  <header>
    <button class="icon-btn" onclick="location.href='index.html'">↩</button>
    <img src="https://i.ibb.co/XrzQxS3p/file-00000000dbbc821090f43517cfc56949.webp" alt="logo">
    <div class="title" id="chatName">المحادثة</div>
  </header>

  <div id="chat"></div>

  <footer>
    <input type="file" id="fileInput" hidden accept="*/*" onchange="handleFile(this)">
    <button class="action-btn" onclick="document.getElementById('fileInput').click()" title="إرفاق ملف">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="اكتب رسالة..." oninput="this.style.height='';this.style.height=this.scrollHeight+'px'"></textarea>
    <button class="action-btn" id="record-btn" onclick="toggleRecord()" title="تسجيل صوتي">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button class="send-btn" onclick="sendText()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, where, getDocs, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCIYvVSg5KwPnD1lZK7u4oQx1e8l6KXgrc",
      authDomain: "baml-85266.firebaseapp.com",
      projectId: "baml-85266",
      storageBucket: "baml-85266.firebasestorage.app",
      messagingSenderId: "691113580861",
      appId: "1:691113580861:web:42f790d56f436ea6eb8d54"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const uid = localStorage.getItem('loggedInUid');
    const name = localStorage.getItem('loggedInName');
    if (!uid) location.replace('login.html');

    if (localStorage.getItem('theme') !== 'light') document.body.classList.add('dark');

    // باراميترات الرابط
    const urlParams = new URLSearchParams(location.search);
    const otherUid = urlParams.get('user');
    const chatId = urlParams.get('chatId');
    if (!otherUid || !chatId) location.replace('index.html');

    // تحميل اسم الطرف التاني
    getDoc(doc(db, 'users', otherUid)).then(snap => {
      if (snap.exists()) document.getElementById('chatName').textContent = snap.data().name;
    });

    // --- تحميل الرسائل ---
    const chatContainer = document.getElementById('chat');
    const msgQuery = query(collection(db, `chats/${chatId}/messages`), orderBy('createdAt', 'asc'));
    onSnapshot(msgQuery, (snapshot) => {
      chatContainer.innerHTML = '';
      snapshot.forEach((docSnap) => {
        const m = docSnap.data();
        const el = document.createElement('div');
        el.className = `msg ${m.sender === uid ? 'me' : ''}`;
        
        let content = '';
        if (m.type === 'text') content = escapeHtml(m.text);
        else if (m.type === 'image') content = `<img src="${m.data}" alt="صورة">`;
        else if (m.type === 'video') content = `<video src="${m.data}" controls></video>`;
        else if (m.type === 'audio') content = `<audio src="${m.data}" controls></audio>`;
        else if (m.type === 'file') content = `<a class="file-link" href="${m.data}" download="${m.fileName}">📎 ${escapeHtml(m.fileName)}</a>`;
        
        el.innerHTML = `<div class="who">${escapeHtml(m.senderName)}</div>${content}`;
        chatContainer.appendChild(el);

        // تعليم الرسائل كـ مقروءة (لو أنا مش المرسل)
        if (m.sender !== uid && !m.read) {
          updateDoc(doc(db, `chats/${chatId}/messages`, docSnap.id), { read: true });
        }
      });
      chatContainer.scrollTop = chatContainer.scrollHeight;
    });

    function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));}

    // --- إرسال النصوص ---
    window.sendText = async () => {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      input.style.height = '';
      await addMessage({ type: 'text', text });
    };
    document.getElementById('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });

    // --- رفع الملفات والصور والفيديو ---
    // ملاحظة: الفايرستور بيدعم لحد 1 ميجا للمستند الواحد
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    window.handleFile = async (input) => {
      const file = input.files[0];
      if (!file) return;
      
      if (file.size > 900 * 1024) { // 900 كيلو كحد أقصى للأمان
        alert('حجم الملف كبير جداً. الفايرستور يسمح بحد أقصى 1 ميجا. جرب ملف أصغر.');
        input.value = '';
        return;
      }

      try {
        const base64 = await fileToBase64(file);
        let type = 'file';
        if (file.type.startsWith('image/')) type = 'image';
        else if (file.type.startsWith('video/')) type = 'video';
        else if (file.type.startsWith('audio/')) type = 'audio';

        await addMessage({ type, data: base64, fileName: file.name });
      } catch (e) {
        alert('حدث خطأ أثناء رفع الملف');
      }
      input.value = '';
    };

    // --- تسجيل صوتي ---
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    window.toggleRecord = async () => {
      const btn = document.getElementById('record-btn');
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            if (blob.size > 900 * 1024) {
              alert('الريكورد طويل جداً. جرب تسجيل أقصر.');
              return;
            }
            const base64 = await fileToBase64(blob);
            await addMessage({ type: 'audio', data: base64 });
            stream.getTracks().forEach(t => t.stop());
          };
          mediaRecorder.start();
          isRecording = true;
          btn.classList.add('recording');
          btn.style.color = '#ff4d4d';
        } catch(e) { alert('محتاج إذن الميكروفون'); }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btn.classList.remove('recording');
        btn.style.color = '';
      }
    };

    // --- إرسال إشعار للطرف التاني ---
    const PUSH_API = 'https://YOUR-SERVER.vercel.app/api/send'; // ← غيّر الرابط ده برابط السيرفر بعد النشر
    function notifyRecipient(msgId) {
      fetch(PUSH_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chatId, msgId, to: otherUid })
      }).catch(() => {});
    }

    // --- دالة إرسال موحدة ---
    async function addMessage(payload) {
      const sentRef = await addDoc(collection(db, `chats/${chatId}/messages`), {
        ...payload,
        sender: uid,
        senderName: name,
        read: false,
        createdAt: serverTimestamp()
      });
      notifyRecipient(sentRef.id);
    }
  </script>
</body>
</html>
