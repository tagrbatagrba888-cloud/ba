async function enablePush(u,manual){
 const say=m=>{if(manual)alert(m);return m};
 try{
  if(!VAPID.startsWith('B'))return say('مفتاح VAPID غير مضاف في الكود');
  if(!('Notification' in window)||!firebase.messaging.isSupported())return say('المتصفح لا يدعم الإشعارات. على الآيفون: ثبّت الموقع على الشاشة الرئيسية أولا (iOS 16.4 أو أحدث)');
  if(Notification.permission==='denied')return say('الإشعارات محظورة. فعّلها من إعدادات الموقع أو التطبيق في الهاتف');
  if(Notification.permission!=='granted'&&!manual)return;
  if(await Notification.requestPermission()!=='granted')return say('لم يتم السماح بالإشعارات');

  return say('تم تفعيل الإشعارات على هذا الجهاز ✅')
 }catch(e){return say('خطأ: '+(e.code||e.message))}}

const peer=new URLSearchParams(location.search).get('u');
guard(async(me,my)=>{
 const cid=[me.uid,peer].sort().join('_'),col=db.collection('chats/'+cid+'/messages'),fc=db.collection('chats/'+cid+'/files');
 const pu=(await db.doc('users/'+peer).get()).data()||{username:'؟'},nk=db.doc('users/'+me.uid+'/nicks/'+peer);
 let name=pu.username;nk.onSnapshot(s=>{name=s.exists?s.data().name:pu.username;$('ttl').textContent=name});
 $('ttl').onclick=()=>{const n=prompt('اسم جديد لهذا المستخدم',name);if(n)nk.set({name:n})};
 const notify=async t=>{try{fetch('/api/notify',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+await auth.currentUser.getIdToken()},body:JSON.stringify({to:peer,body:t})})}catch(e){}};
 const LBL={image:'📷 صورة',video:'🎬 فيديو',audio:'🎤 رسالة صوتية',file:'📄 ملف'};
 let msgs=[],sel=new Set(),editing=null,urls={};
 col.orderBy('createdAt').onSnapshot(s=>{msgs=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
 function draw(){const box=$('msgs'),pr=box.parentNode,end=pr.scrollHeight-pr.scrollTop-pr.clientHeight<120;
  box.innerHTML='';
  msgs.forEach(m=>{const d=document.createElement('div'),mine=m.from===me.uid;
   d.className='b'+(mine?' me':'')+(sel.has(m.id)?' sel':'');
   let h=m.type==='text'?m.text.replace(/</g,'&lt;'):'<div class="f">'+(m.type==='file'?'📄 '+m.name:'⏳')+'</div>';
   const rx=Object.values(m.rx||{}).join('');
   d.innerHTML=h+(rx?'<div class="rx">'+rx+'</div>':'')+'<small>'+(m.createdAt?m.createdAt.toDate().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'')+(m.edited?' • معدّلة':'')+'</small>';
   let t;d.onpointerdown=()=>{t=setTimeout(()=>{t=0;tog(m.id)},450)};d.onpointerup=d.onpointerleave=()=>{if(t){clearTimeout(t);t=0;if(sel.size)tog(m.id)}};
   d.oncontextmenu=e=>e.preventDefault();box.appendChild(d);
   if(m.fid)media(m,d.querySelector('.f'))});
  if(end)pr.scrollTop=1e9;bar()}
 function tog(id){sel.has(id)?sel.delete(id):sel.add(id);draw()}
 function bar(){const b=$('bar');b.classList.toggle('hide',!sel.size);if(!sel.size)return;
  const ms=[...sel].map(i=>msgs.find(m=>m.id===i)).filter(Boolean),own=ms.every(m=>m.from===me.uid);
  b.innerHTML='<button data-x="x">✕</button>'+['👍','❤️','😂','😮','😢','🙏'].map(e=>'<button data-r="'+e+'">'+e+'</button>').join('')
   +(ms.length===1&&own&&ms[0].type==='text'?'<button data-x="e">✏️</button>':'')+(own?'<button data-x="d">🗑️ ('+ms.length+')</button>':'');
  b.querySelectorAll('button').forEach(x=>x.onclick=async()=>{
   if(x.dataset.r){for(const m of ms){const r=m.rx||{};r[me.uid]===x.dataset.r?delete r[me.uid]:r[me.uid]=x.dataset.r;await col.doc(m.id).update({rx:r})}sel.clear();draw()}
   else if(x.dataset.x==='x'){sel.clear();draw()}
   else if(x.dataset.x==='e'){editing=ms[0].id;$('tx').value=ms[0].text;$('tx').focus();sel.clear();draw()}
   else if(x.dataset.x==='d'&&confirm('حذف '+ms.length+' رسالة؟')){for(const m of ms){if(m.fid)for(let i=0;i<m.n;i++)fc.doc(m.fid+'_'+i).delete();await col.doc(m.id).delete()}sel.clear()}})}
 async function media(m,el){try{
  if(!urls[m.fid]){const parts=await Promise.all(Array.from({length:m.n},(_,i)=>fc.doc(m.fid+'_'+i).get()));
   let b=await (await fetch('data:application/octet-stream;base64,'+parts.map(p=>p.data().d).join(''))).blob();
   if(m.gz)b=await new Response(b.stream().pipeThrough(new DecompressionStream('gzip'))).blob();
   urls[m.fid]=URL.createObjectURL(new Blob([b],{type:m.mime}))}
  const u=urls[m.fid];
  el.innerHTML=m.type==='image'?'<img src="'+u+'">':m.type==='video'?'<video controls playsinline src="'+u+'"></video>':m.type==='audio'?'<audio controls src="'+u+'"></audio>':'<a style="color:inherit;font-weight:700" download="'+m.name+'" href="'+u+'">📄 '+m.name+' ('+Math.round(m.size/1024)+'KB)</a>'
 }catch(e){el.textContent='تعذر تحميل الملف'}}
 async function send(){const v=$('tx').value.trim();if(!v)return;$('tx').value='';

  else{await col.add({from:me.uid,to:peer,type:'text',text:v,createdAt:TS()});notify(v)}}
 $('snd').onclick=send;$('tx').onkeydown=e=>{if(e.key==='Enter')send()};
 const kind=f=>f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':f.type.startsWith('audio/')?'audio':'file';
 async function sendFile(f,type){
  if(f.size>25e6)return alert('الملف كبير جدا (الحد 25MB قبل الضغط)');
  let b=f,gz=0;
  if(f.type.startsWith('image/')&&f.type!=='image/gif'){const bm=await createImageBitmap(f),k=Math.min(1,1280/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);b=await new Promise(r=>c.toBlob(r,'image/jpeg',.6))}
  else if(window.CompressionStream&&!/^(video|audio)\//.test(f.type)){b=await new Response(f.stream().pipeThrough(new CompressionStream('gzip'))).blob();gz=1}

  const s=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(b)});

  for(let i=0;i<n;i++)await fc.doc(fid+'_'+i).set({d:s.slice(i*N,(i+1)*N)});
  await col.add({from:me.uid,to:peer,type:ty,fid,n,gz,mime:f.type||'application/octet-stream',name:f.name||'file',size:f.size,createdAt:TS()});notify(LBL[ty])}
 $('at').onclick=()=>$('fi').click();$('fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)await sendFile(f)};
 let rec,ch=[];$('mic').onclick=async()=>{
  if(rec&&rec.state==='recording')return rec.stop();
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st,{audioBitsPerSecond:24000});ch=[];
   rec.ondataavailable=e=>ch.push(e.data);
   rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());$('mic').classList.remove('rec');const t=rec.mimeType||'audio/webm';sendFile(new File(ch,'voice.'+(t.includes('mp4')?'m4a':'webm'),{type:t}),'audio')};
   rec.start();$('mic').classList.add('rec')}catch(e){alert('لا يمكن الوصول للميكروفون')}};
});
